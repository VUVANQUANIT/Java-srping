spring.application.name=myapp
server.port=8080

# PostgreSQL Database Configuration
# Force timezone in JDBC URL - use lowercase timezone parameter
spring.datasource.url=jdbc:postgresql://localhost:5432/orders_db?timezone=UTC
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# S? d?ng timezone h?p l? - Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Ho?c:
# spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# C?u h�nh JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Cấu hình logging để hiển thị query execution time
# Bật Hibernate statistics để theo dõi performance
spring.jpa.properties.hibernate.generate_statistics=true

# Logging configuration cho Hibernate
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.stat=DEBUG
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=INFO

# Log query execution time và slow queries
# Hiển thị queries chạy chậm hơn 1000ms (1 giây)
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000

# Logging pattern với timestamp
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
# Force timezone on each connection when it's created
spring.datasource.hikari.connection-init-sql=SET timezone = 'UTC'
# JWT Configuration
jwt.secret=9f3eA!d0XK2pL8QmZrT1U#WcVYJ@B7Hs
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always