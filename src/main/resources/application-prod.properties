spring.application.name=myapp
server.port=8080

# PostgreSQL Database Configuration
# Force timezone in JDBC URL - use lowercase timezone parameter
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# S? d?ng timezone h?p l? - Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Ho?c:
# spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# C?u h�nh JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
# Force timezone on each connection when it's created
spring.datasource.hikari.connection-init-sql=SET timezone = 'UTC'
# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=604800000

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.show-actuator=false